<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarthMC Price Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            border: 1px solid #333;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #f0a500;
            border: none;
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background: #d49400;
        }
        .error {
            color: #ff6b6b;
            margin-top: 10px;
            display: none;
        }
        #reportContainer {
            width: 100%;
            max-width: 1400px;
            height: 90vh;
        }
        #reportContainer iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <!-- Форма входа -->
    <div id="loginContainer" class="container">
        <h2>🔐 EarthMC Price Report</h2>
        <p>Enter your 32-digit access code</p>
        <input type="text" id="accessCode" placeholder="Enter your code">
        <button onclick="checkCode()">Access Report</button>
        <div class="error" id="errorMsg">❌ Invalid code. Please check and try again.</div>
    </div>

    <!-- Контейнер для iframe с отчётом -->
    <div id="reportContainer" style="display: none;"></div>

    <script>
        // --- Твой список разрешённых кодов ---
        const WHITELIST = [
            "11111111111111111111111111111111"
            // добавляй сюда новые коды
        ];

        // Сохраняем сессию, чтобы не вводить код каждый раз
        if (sessionStorage.getItem('accessGranted')) {
            document.getElementById('loginContainer').style.display = 'none';
            loadReport();
        }

        async function checkCode() {
            const input = document.getElementById('accessCode').value.trim();
            const errorEl = document.getElementById('errorMsg');

            if (input.length === 0) {
                errorEl.style.display = 'block';
                errorEl.textContent = '❌ Please enter a code.';
                return;
            }

            if (!WHITELIST.includes(input)) {
                errorEl.style.display = 'block';
                errorEl.textContent = '❌ Invalid code. Access denied.';
                return;
            }

            errorEl.style.display = 'none';
            sessionStorage.setItem('accessGranted', 'true');
            document.getElementById('loginContainer').style.display = 'none';
            loadReport();
        }

        async function loadReport() {
            try {
                // Загружаем HTML-отчёт из скрытой папки _reports
                const response = await fetch('_reports/price_report_english.html');
                if (!response.ok) throw new Error('Report not found');
                const htmlText = await response.text();

                // Создаём iframe с содержимым через blob URL
                const blob = new Blob([htmlText], { type: 'text/html' });
                const url = URL.createObjectURL(blob);

                const container = document.getElementById('reportContainer');
                container.style.display = 'block';
                container.innerHTML = `<iframe src="${url}"></iframe>`;
            } catch (err) {
                document.getElementById('loginContainer').style.display = 'block';
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('errorMsg').textContent = '⚠️ Could not load report. Please try again later.';
                console.error(err);
            }
        }

        // Enter для отправки
        document.getElementById('accessCode').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkCode();
        });
    </script>
</body>
</html>
